name: Build & Test
on:
  push:
    branches:
      - main
      - develop
      - release/*
      - integration-test-workflow
  pull_request:
    branches:
      - main
      - develop
      - release/*

defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: write

env:
  CG_EXEC: ionice -c 2 -n 2 nice -n 19

jobs:
  build:
    name: Build using Node ${{ matrix.node }}
    runs-on: hiero-client-sdk-linux-medium
    strategy:
      matrix:
        node: [ "22", "24" ]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.35.1

      - name: Install PNPM
        uses: step-security/action-setup@8beec6731697ff7a074963eaa56f6d8e02e1c399 # v6.1.0
        with:
          version: 9.15.5

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Build @hiero-ledger/sdk
        run: task -v build

      - name: Check published package sizes
        run: task -v size:check

  test:
    name: Test using Node ${{ matrix.node }}
    runs-on: hiero-client-sdk-linux-large
    # Backstop for anything outside the test step. A healthy run takes 12-22
    # min, plus up to 20 more when apt is slow in "Install Playwright
    # Dependencies". The step caps below are what end a hung Solo network.
    timeout-minutes: 60
    strategy:
      matrix:
        node: [ "22" ]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.35.1

      - name: Install PNPM
        uses: step-security/action-setup@8beec6731697ff7a074963eaa56f6d8e02e1c399 # v6.1.0
        with:
          version: 9.15.5

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: task install

      - name: Install Playwright Dependencies
        id: playwright-deps
        run: |
          sudo npx playwright install-deps
          npx playwright install

      - name: Prepare Hiero Solo
        id: solo
        uses: hiero-ledger/hiero-solo-action@c982fe02b37db2a25a6a5e61139d9fe5d0917cff # 0.26.0
        with:
          installMirrorNode: true
          soloVersion: v0.91.0
          nodeVersion: ${{ matrix.node }}
          installBlockNode: true
          hieroVersion: v0.73.0
          mirrorNodeVersion: v0.153.0
          haproxyPort: 50211
          mirrorNodePortRest: 5551
          grpcProxyPort: 8080

      # The Solo action reaches the consensus node through a kubectl
      # port-forward and haproxy. In the hung runs that path stopped answering
      # a minute or two into the tests while envoy's direct path to the same
      # node kept working, so 50211 (and 36211 in dual mode) is connected
      # straight to the node's NodePort instead; the script header has the
      # details and the fallbacks.
      - name: Connect the consensus node port directly
        run: node .github/scripts/forward-consensus-port.mjs

      - name: Set Operator Account
        run: |
          echo "OPERATOR_KEY=${{ steps.solo.outputs.ed25519PrivateKey }}" >> $GITHUB_ENV
          echo "OPERATOR_ID=${{ steps.solo.outputs.ed25519AccountId }}" >> $GITHUB_ENV
          echo "GENESIS_OPERATOR_KEY=302e020100300506032b65700422042091132178e72057a1d7528025956fe39b0b847f200ab59b2fdd367017f3087137" >> $GITHUB_ENV
          echo "GENESIS_OPERATOR_ID=0.0.2" >> $GITHUB_ENV
          echo "HEDERA_NETWORK=local-node" >> $GITHUB_ENV

      # --bail=1 stops vitest at the first failing test. Without it, a Solo
      # network that stops answering mid-run makes every remaining test wait
      # out its full timeout (107 tests x 120 s in run 36851615726), so a job
      # that fails after 5 min kept running for over an hour. The step cap
      # covers what bail cannot see: a healthy run takes 4-9 min.
      - name: Run Hedera SDK Integration Tests
        timeout-minutes: 25
        run: ${{ env.CG_EXEC }} task test:integration:codecov -- --bail=1

      - name: Build @hiero-ledger/cryptography
        working-directory: packages/cryptography
        run: ${{ env.CG_EXEC }} task build

      - name: Unit Coverage @hiero-ledger/cryptography
        working-directory: packages/cryptography
        run: ${{ env.CG_EXEC }} task test:unit:codecov

      - name: Test Unit Coverage @hiero-ledger/sdk
        run: ${{ env.CG_EXEC }} task test:unit:codecov

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-test
          if-no-files-found: error
          path: |
            ./coverage/node-integration/lcov.info
            ./coverage/browser-integration/lcov.info
            ./packages/cryptography/coverage/node/lcov.info
            ./packages/cryptography/coverage/browser/lcov.info
            ./coverage/node/lcov.info
            ./coverage/browser/lcov.info

      - name: Upload consensus port forward logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consensus-port-forward-test-node-${{ matrix.node }}
          path: ${{ runner.temp }}/consensus-port-forward/
          if-no-files-found: ignore

  dab-tests:
    name: DAB Tests using Node ${{ matrix.node }}
    runs-on: hiero-client-sdk-linux-medium
    # Backstop, same reasoning as the test job: 8-9 min healthy, up to 29
    # min when apt is slow.
    timeout-minutes: 60
    strategy:
      matrix:
        node: [ "22" ]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.35.1

      - name: Install PNPM
        uses: step-security/action-setup@8beec6731697ff7a074963eaa56f6d8e02e1c399 # v6.1.0
        with:
          version: 9.15.5

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: task install

      - name: Install Playwright Dependencies
        id: playwright-deps
        run: |
          sudo npx playwright install-deps
          npx playwright install

      - name: Prepare Hiero Solo
        id: solo
        uses: hiero-ledger/hiero-solo-action@c982fe02b37db2a25a6a5e61139d9fe5d0917cff # 0.26.0
        with:
          installMirrorNode: true
          soloVersion: v0.91.0
          nodeVersion: ${{ matrix.node }}
          hieroVersion: v0.73.0
          mirrorNodeVersion: v0.153.0
          haproxyPort: 50211
          mirrorNodePortRest: 5551
          grpcProxyPort: 8080
          dualMode: true
          dualModeGrpcProxyPort: 8081

      # The Solo action reaches the consensus node through a kubectl
      # port-forward and haproxy. In the hung runs that path stopped answering
      # a minute or two into the tests while envoy's direct path to the same
      # node kept working, so 50211 (and 36211 in dual mode) is connected
      # straight to the node's NodePort instead; the script header has the
      # details and the fallbacks.
      - name: Connect the consensus node port directly
        run: node .github/scripts/forward-consensus-port.mjs

      - name: Set Operator Account
        run: |
          echo "OPERATOR_KEY=${{ steps.solo.outputs.ed25519PrivateKey }}" >> $GITHUB_ENV
          echo "OPERATOR_ID=${{ steps.solo.outputs.ed25519AccountId }}" >> $GITHUB_ENV
          echo "GENESIS_OPERATOR_KEY=302e020100300506032b65700422042091132178e72057a1d7528025956fe39b0b847f200ab59b2fdd367017f3087137" >> $GITHUB_ENV
          echo "GENESIS_OPERATOR_ID=0.0.2" >> $GITHUB_ENV
          echo "HEDERA_NETWORK=local-node" >> $GITHUB_ENV

      # A healthy run of this step takes 0.7-1.7 min.
      - name: Run DAB Integration Coverage
        timeout-minutes: 15
        run: task test:integration:dual-mode:codecov -- --bail=1

      - name: Upload DAB Coverage Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-dab
          if-no-files-found: error
          path: |
            ./coverage/node-integration-dual-mode/lcov.info
            ./coverage/browser-integration-dual-mode/lcov.info

      - name: Upload consensus port forward logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consensus-port-forward-dab-tests-node-${{ matrix.node }}
          path: ${{ runner.temp }}/consensus-port-forward/
          if-no-files-found: ignore

  coverage-upload:
    name: Upload Coverage to Codecov
    runs-on: hiero-client-sdk-linux-medium
    needs:
      - test
      - dab-tests

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Download Test Coverage Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-test
          path: .

      - name: Download DAB Coverage Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-dab
          path: .

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: >-
            ./coverage/node-integration/lcov.info,
            ./coverage/browser-integration/lcov.info,
            ./packages/cryptography/coverage/node/lcov.info,
            ./packages/cryptography/coverage/browser/lcov.info,
            ./coverage/node/lcov.info,
            ./coverage/browser/lcov.info,
            ./coverage/node-integration-dual-mode/lcov.info,
            ./coverage/browser-integration-dual-mode/lcov.info
          fail_ci_if_error: true

  examples:
    name: Run examples using Node ${{ matrix.node }}
    runs-on: hiero-client-sdk-linux-medium
    timeout-minutes: 60
    strategy:
      matrix:
        node: [ "22" ]
    steps:
      -  name: Harden Runner
         uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
         with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.35.1

      - name: Install PNPM
        uses: step-security/action-setup@8beec6731697ff7a074963eaa56f6d8e02e1c399 # v6.1.0
        with:
          version: 9.15.5

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies and build SDK
        run: task build

      - name: Prepare Hiero Solo
        id: solo
        uses: hiero-ledger/hiero-solo-action@c982fe02b37db2a25a6a5e61139d9fe5d0917cff # 0.26.0
        with:
          installMirrorNode: true
          soloVersion: v0.91.0
          nodeVersion: ${{ matrix.node }}
          installBlockNode: true
          hieroVersion: v0.73.0
          mirrorNodeVersion: v0.153.0
          haproxyPort: 50211
          mirrorNodePortRest: 5551
          grpcProxyPort: 8080

      # The Solo action reaches the consensus node through a kubectl
      # port-forward and haproxy. In the hung runs that path stopped answering
      # a minute or two into the tests while envoy's direct path to the same
      # node kept working, so 50211 (and 36211 in dual mode) is connected
      # straight to the node's NodePort instead; the script header has the
      # details and the fallbacks.
      - name: Connect the consensus node port directly
        run: node .github/scripts/forward-consensus-port.mjs

      - name: Set Operator Account
        run: |
          echo "OPERATOR_KEY=${{ steps.solo.outputs.ecdsaPrivateKey }}" >> $GITHUB_ENV
          echo "OPERATOR_ID=${{ steps.solo.outputs.ecdsaAccountId }}" >> $GITHUB_ENV
          echo "GENESIS_OPERATOR_KEY=302e020100300506032b65700422042091132178e72057a1d7528025956fe39b0b847f200ab59b2fdd367017f3087137" >> $GITHUB_ENV
          echo "GENESIS_OPERATOR_ID=0.0.2" >> $GITHUB_ENV
          echo "HEDERA_NETWORK=local-node" >> $GITHUB_ENV

      - name: Install examples dependencies
        run: |
          cd examples
          pnpm i

      # run-all-examples.js pings the node after every failed, killed or slow
      # example and stops the run once two pings in a row go unanswered, so a
      # node that goes dark costs minutes instead of the 60 min job cap.
      - name: Run all examples
        run: task run:examples

      - name: Run excluded balance examples
        run: |
          cd examples
          node batch-tx.js

          cd simple_rest_signature_provider
          server_log="$(mktemp)"
          AUTO_APPROVE=true node src/server.js > "$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            rm -f "$server_log"
          }
          trap cleanup EXIT

          for _ in {1..30}; do
            if curl --silent --output /dev/null http://127.0.0.1:3000/; then
              break
            fi
            sleep 1
          done

          if ! kill -0 "$server_pid" 2>/dev/null; then
            cat "$server_log"
            exit 1
          fi

          node src/client.js || {
            cat "$server_log"
            exit 1
          }

      - name: Type-check excluded React Native example
        run: |
          cd examples/react-native-example
          ./node_modules/.bin/tsc --noEmit

      - name: Upload consensus port forward logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consensus-port-forward-examples-node-${{ matrix.node }}
          path: ${{ runner.temp }}/consensus-port-forward/
          if-no-files-found: ignore

  tck:
    # The job name is the status check context: "Build & Test / TCK
    # Compatibility". It is meant to become a required check (repository
    # ruleset 650010, next to "Test using Node 22"), so rename it only
    # together with the ruleset.
    name: TCK Compatibility
    runs-on: hiero-client-sdk-linux-large
    # Runs the hiero-sdk-tck conformance suite against this commit through the
    # JSON-RPC server in tck/, which uses the local build (file:..). It starts
    # only after the required jobs of this workflow (Build using Node 22 and
    # 24, Test using Node 22) have passed, so a change that already fails a
    # build or a test does not spend a Solo network and a large runner on it.
    # The gate is limited to required jobs on purpose: a job skipped behind a
    # failed prerequisite counts as passed for a required check, and the
    # required prerequisite is what then blocks the merge.
    needs:
      - build
      - test
    # A healthy run takes about 15 min: build 1, Solo 5, tests 7
    # (hiero-sdk-tck run 37763450768 on 9ace346d: 2189 passed, 233 pending).
    timeout-minutes: 45
    env:
      NODE_VERSION: "22"

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.35.1

      - name: Install PNPM
        uses: step-security/action-setup@8beec6731697ff7a074963eaa56f6d8e02e1c399 # v6.1.0
        with:
          version: 9.15.5

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies and build SDK
        run: task build

      # The server resolves @hiero-ledger/sdk to this checkout (file:..), so
      # it serves the build from the step above.
      - name: Start the TCK server
        id: tck-server
        working-directory: tck
        run: |
          npm install
          nohup npm run start > "${RUNNER_TEMP}/tck-server.log" 2>&1 &
          echo "pid=$!" >> "${GITHUB_OUTPUT}"

      - name: Prepare Hiero Solo
        id: solo
        uses: hiero-ledger/hiero-solo-action@c982fe02b37db2a25a6a5e61139d9fe5d0917cff # 0.26.0
        with:
          installMirrorNode: true
          soloVersion: v0.91.0
          nodeVersion: ${{ env.NODE_VERSION }}
          hieroVersion: v0.73.0
          mirrorNodeVersion: v0.153.0
          haproxyPort: 50211
          mirrorNodePortRest: 5551
          grpcProxyPort: 8080

      # Same reasoning as the test job: 50211 is connected straight to the
      # node's NodePort instead of the kubectl port-forward and haproxy chain
      # that stopped answering in the hung runs.
      - name: Connect the consensus node port directly
        run: node .github/scripts/forward-consensus-port.mjs

      # The TCK's own action waits for the server, runs the suite, writes the
      # counts to the job summary, uploads the mochawesome report and fails
      # last. Its network defaults match the Solo inputs above (consensus
      # 50211, mirror REST 5551, mirror gRPC 5600, REST Java 8084, genesis
      # operator 0.0.2). The commit pins the suite and the action together, so
      # bump it on purpose, with a TCK release: pin the full commit SHA of the
      # release tag and name the tag in the comment. A new TCK test for a
      # feature the SDK does not have yet would otherwise turn this job red.
      - name: Run the TCK
        timeout-minutes: 20
        uses: hiero-ledger/hiero-sdk-tck@c9e7169888d86be4793cde5932ce57d9450a9761 # v0.14.0
        with:
          artifact-name: tck-compatibility

      - name: Show the TCK server log
        if: failure()
        run: cat "${RUNNER_TEMP}/tck-server.log" || true

      - name: Upload the TCK server and port forward logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tck-compatibility-logs
          path: |
            ${{ runner.temp }}/tck-server.log
            ${{ runner.temp }}/consensus-port-forward/
          if-no-files-found: ignore

      - name: Stop the TCK server
        if: always()
        run: |
          if [ -n "${{ steps.tck-server.outputs.pid }}" ]; then
            kill "${{ steps.tck-server.outputs.pid }}" 2>/dev/null || true
          fi

  solo:
    # The job name is the status check context: "Build & Test / Solo
    # Compatibility". It is not a required check yet: make it one (repository
    # ruleset 650010) after two weeks without false failures (#4535).
    name: Solo Compatibility
    runs-on: hiero-client-sdk-linux-large
    # Solo uses this SDK for account creation, key updates and node operations,
    # but the other Solo jobs here run Solo with its own pinned SDK. This job
    # installs a pinned Solo release with this commit's SDK, proto and
    # cryptography packages forced in through npm overrides, fails unless Solo
    # resolves exactly that SDK, and then has Solo deploy a network and manage
    # an account. Gated on the build like the TCK job, so a change that does
    # not build does not spend a Solo network.
    needs:
      - build
    timeout-minutes: 60
    env:
      NODE_VERSION: "22"
      # Pinned together: bump them on purpose. Solo 0.93.0 deploys CN v0.77.2
      # and mirror node v0.163.0 by default; the flags below pin them anyway.
      SOLO_VERSION: "0.93.0"
      CONSENSUS_NODE_VERSION: "v0.77.2"
      MIRROR_NODE_VERSION: "v0.163.0"
      SOLO_DEPLOYMENT: one-shot
      NO_COLOR: "1"

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.35.1

      - name: Install PNPM
        uses: step-security/action-setup@8beec6731697ff7a074963eaa56f6d8e02e1c399 # v6.1.0
        with:
          version: 9.15.5

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies and build SDK
        run: task build

      # pnpm pack turns the workspace:* dependencies into the versions in this
      # checkout, so the SDK tarball asks for the proto and cryptography
      # tarballs packed next to it, published or not. SOLO_HOME keeps Solo's
      # tools, logs and diagnostics in one place for the artifact below.
      - name: Pack the SDK
        run: |
          packs="${RUNNER_TEMP}/solo-compat/packs"
          mkdir -p "${packs}" "${RUNNER_TEMP}/solo-compat/solo"
          for dir in packages/proto packages/cryptography .; do
            (cd "${dir}" && pnpm pack --pack-destination "${packs}")
          done
          ls -l "${packs}"
          {
            echo "SOLO_DIR=${RUNNER_TEMP}/solo-compat/solo"
            echo "SOLO_HOME=${RUNNER_TEMP}/solo-compat/home"
          } >> "${GITHUB_ENV}"
          {
            echo "${RUNNER_TEMP}/solo-compat/solo/node_modules/.bin"
            echo "${RUNNER_TEMP}/solo-compat/home/bin"
          } >> "${GITHUB_PATH}"

      # Fails unless every copy of the SDK in Solo's tree is this commit's
      # tarball and Solo's own require and import both resolve it. Writes the
      # versions and the SDK identity to the job summary.
      - name: Install Solo with this SDK
        timeout-minutes: 10
        run: node .github/scripts/solo-compat.mjs install "${RUNNER_TEMP}/solo-compat/packs"

      # Creates the kind cluster and deploys a consensus node, a mirror node,
      # the explorer and the relay. Consensus gRPC ends up on 127.0.0.1:35211
      # and the mirror ingress on 127.0.0.1:38081. The runner is itself a
      # Kubernetes pod, and without --namespace Solo takes the runner pod's
      # namespace from the in-cluster context.
      - name: Deploy the network with Solo
        timeout-minutes: 30
        run: |
          solo one-shot single deploy --quiet-mode \
            --namespace "${SOLO_DEPLOYMENT}" \
            --consensus-node-version "${CONSENSUS_NODE_VERSION}" \
            --mirror-node-version "${MIRROR_NODE_VERSION}"

      - name: Create an account and update its key with Solo
        timeout-minutes: 10
        run: |
          log="${RUNNER_TEMP}/solo-compat/account-create.log"
          solo ledger account create --deployment "${SOLO_DEPLOYMENT}" --hbar-amount 100 | tee "${log}"
          account_id=$(grep -m1 '"accountId"' "${log}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "${account_id}" ]; then
            echo "::error::no account ID in the solo ledger account create output"
            exit 1
          fi
          key=$(node .github/scripts/solo-compat.mjs new-key)
          solo ledger account update --deployment "${SOLO_DEPLOYMENT}" --account-id "${account_id}" --ed25519-private-key "${key}"
          {
            echo "ACCOUNT_ID=${account_id}"
            echo "ACCOUNT_KEY=${key}"
          } >> "${GITHUB_ENV}"

      # As the account, with the new key: checks the key, submits a transfer
      # and a topic message, checks the receipts and finds both on the mirror
      # node.
      - name: Use the network with this SDK
        timeout-minutes: 10
        run: node .github/scripts/solo-compat.mjs check-network

      - name: Collect diagnostics
        if: failure()
        continue-on-error: true
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -100 || true
          timeout 600 solo deployment diagnostics all --deployment "${SOLO_DEPLOYMENT}" --quiet-mode || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solo-compatibility-diagnostics
          path: |
            ${{ runner.temp }}/solo-compat/home/logs/
            ${{ runner.temp }}/solo-compat/account-create.log
            ${{ runner.temp }}/solo-compat/solo/package.json
            ${{ runner.temp }}/solo-compat/solo/package-lock.json
          if-no-files-found: ignore

      # Runs after partial deployments too. kind delete is the backstop for a
      # destroy that fails; solo-cluster is the cluster the one-shot creates.
      - name: Destroy the network
        if: always()
        timeout-minutes: 10
        run: |
          if command -v solo >/dev/null; then
            solo one-shot single destroy --deployment "${SOLO_DEPLOYMENT}" --quiet-mode || echo "::warning::solo one-shot single destroy failed"
          fi
          if command -v kind >/dev/null; then
            kind delete cluster --name solo-cluster || true
          fi
