version: "3"

silent: true

tasks:
    default:
        deps:
            - build

    install:
        cmds:
            - pnpm i

    build:
        deps:
            - install

    clean:
        cmds:
            - rm -rf node_modules

    test:
        deps:
            - install
        # Run the whole CJS suite (smoke test + mocha) under
        # --no-experimental-require-module. Modern Node can require() ESM
        # natively, which hides ESM-only dependencies sneaking into the
        # lib/*.cjs builds; the flag restores the strict behavior that ts-node
        # and Node <20.19 enforce, so CI on Node 22/24 still catches them.
        env:
            NODE_OPTIONS: --no-experimental-require-module
        cmds:
            - node -e "const { PrivateKey } = require('@hiero-ledger/sdk'); PrivateKey.generateED25519().sign(new Uint8Array([1])); PrivateKey.generateECDSA().sign(new Uint8Array([1])); console.log('strict CJS smoke test OK');"
            - ./node_modules/.bin/mocha --exit --inline-diffs -r @babel/register -r chai/register-expect.js "src/test.js" --timeout 120000
